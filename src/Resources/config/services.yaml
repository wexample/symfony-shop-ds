services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Wexample\SymfonyShopDs\:
        resource: '../../{Command,Form,Service,Twig}'
        exclude: '../../Form/Data'

    Wexample\SymfonyShopDs\Controller\:
        resource: '../../Controller/'
        tags: ['controller.service_arguments']

    # A tag rather than #[AsPeriodicTask]: an application linking this package
    # before installing symfony/scheduler would not compile with the attribute,
    # while a tag nobody reads is left alone.
    Wexample\SymfonyShopDs\Service\CartReminderService:
        tags:
            - name: 'scheduler.task'
              trigger: 'every'
              frequency: !php/const Wexample\SymfonyShopDs\Service\CartReminderService::FREQUENCY
              method: 'remind'
