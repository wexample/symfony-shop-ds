en:
  company: Buying for a company
  company_help: Left empty for a private purchase.
  billing: Billing address
  shipping: Shipping address
  shipping_help: Left empty, it is shipped to the billing address.
  field:
    email:
      label: Email
      help: Where the order is confirmed.
    phone:
      label: Phone
      help: For the delivery, if needed.
    companyName:
      label: Company name
      help: The name the invoice is made out to.
    vatNumber:
      label: VAT number
      help: With its country prefix. A business from another EU country pays no VAT once the number is confirmed.

fr:
  company: Achat pour une entreprise
  company_help: Laissez vide pour un achat à titre privé.
  billing: Adresse de facturation
  shipping: Adresse de livraison
  shipping_help: Laissée vide, la livraison se fait à l'adresse de facturation.
  field:
    email:
      label: E-mail
      help: Où la commande est confirmée.
    phone:
      label: Téléphone
      help: Pour la livraison, si besoin.
    companyName:
      label: Raison sociale
      help: Le nom auquel la facture est établie.
    vatNumber:
      label: Numéro de TVA
      help: Avec son préfixe pays. Une entreprise d'un autre pays de l'UE ne paie pas de TVA une fois le numéro confirmé.

zh:
  company: 为公司购买
  company_help: 如果是私人购买，请留空。
  billing: 账单地址
  shipping: 收货地址
  shipping_help: 留空则发货至账单地址。
  field:
    email:
      label: 电子邮件
      help: 订单确认将发送至此。
    phone:
      label: 电话
      help: 如有需要，用于送货。
    companyName:
      label: 公司名称
      help: 发票抬头的名称。
    vatNumber:
      label: 增值税号码
      help: 需带国家代码。其他欧盟国家的企业在确认后可免交增值税。

ar:
  company: 'شراء لشركة'
  company_help: 'تم تركه فارغًا لشراء خاص.'
  billing: 'عنوان الفوترة'
  shipping: 'عنوان الشحن'
  shipping_help: 'تم تركه فارغًا، سيتم الشحن إلى عنوان الفوترة.'
  field:
    email:
      label: 'البريد الإلكتروني'
      help: 'حيث يتم تأكيد الطلب.'
    phone:
      label: الهاتف
      help: 'للتوصيل، إذا لزم الأمر.'
    companyName:
      label: 'اسم الشركة'
      help: 'الاسم الذي يتم إصدار الفاتورة به.'
    vatNumber:
      label: 'رقم ضريبة القيمة المضافة'
      help: 'مع بادئة دولته. لا تدفع شركة من دولة أخرى في الاتحاد الأوروبي ضريبة القيمة المضافة بمجرد تأكيد الرقم.'
